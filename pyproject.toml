[project]
name = "meteoscope"
version = "0.1.0"
description = "Exploration of meteorological data."
readme = "README.md"
license = "MIT"
authors = [
    { name = "numgrade", email = "num@numgrade.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
]

[project.scripts]
meteoscope = "meteoscope.report:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "tox>=4.65.5",
    "tox-uv>=1.37.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.7",
]

[tool.uv]
default-groups = ["dev", "docs"]  # `uv sync` prendra bien en compte les groupes dev et docs pour l'installation

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
addopts = "--cov=meteoscope --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]