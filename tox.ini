[tox]
envlist = py311, py312, py313, py314, lint, docs
isolated_build = true

[testenv]
description = tests unitaires + couverture
commands = pytest {posargs}

[testenv:lint]
description = ruff check + format
commands =
    ruff check .
    ruff format --check .

[testenv:docs]
description = build de la documentation mkdocs
groups = dev, docs
commands = mkdocs build --strict